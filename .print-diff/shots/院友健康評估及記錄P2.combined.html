<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  /* 範本的 body{margin:0} 已被隔離到容器 class，外層 body 必須自行歸零，
     否則瀏覽器預設 8px margin 會改變每份文件的版面位置並可能導致超頁 */
  html, body { margin: 0; padding: 0; }
  [class*="print-doc-"] + [class*="print-doc-"] { page-break-before: always; break-before: page; }
</style>
<style>
        @page print-doc-0 {
            size: A4;
            margin: 5mm 0.25in;
        }

        .print-doc-0{
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            width: 100%;
            color: #000;
        }

        .print-doc-0 .container{ width: 100%; box-sizing: border-box; }

        /* 標題與小項 */
        .print-doc-0 .section-title{ font-size: 18px; font-weight: bold; margin: 8px 0 3px 20px; }

        /* 表格通用設定 */
        .print-doc-0 table{ width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 10px; }
        .print-doc-0 th,.print-doc-0 td{ border: 1px solid black; text-align: center; vertical-align: middle; padding: 0px; height: 24px; font-size: 14px; }
        
        .print-doc-0 .bold{ font-weight: bold; }
        .print-doc-0 .label-m{ width: 10mm; font-weight: bold; font-size: 16px; line-height: 1.1; }
        .print-doc-0 .label-s{ width: 25mm; font-weight: bold; text-align: left; padding-left: 3px; font-size: 13px; }
        .print-doc-0 .col-eval{ width: auto; }

        /* DB組件 - 填滿整個格子且透明 */
        .print-doc-0 .db-text-cell{ 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: transparent; 
            font-family: inherit; 
            font-size: 12px; 
            text-align: center; 
            outline: none;
            display: block;
            box-sizing: border-box;
        }

        /* 頁尾 */
        .print-doc-0 .footer{ display: flex; justify-content: flex-end; position: relative; height: 25px; font-weight: bold; margin-top: 5px; }
        .print-doc-0 .page-num{ position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; bottom: 0; }
        .print-doc-0 .doc-code{ font-size: 10px; align-self: flex-end; }
    </style>
<style>.print-doc-0 { page: print-doc-0; }</style>
</head>
