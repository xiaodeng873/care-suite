<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  /* 範本的 body{margin:0} 已被隔離到容器 class，外層 body 必須自行歸零，
     否則瀏覽器預設 8px margin 會改變每份文件的版面位置並可能導致超頁 */
  html, body { margin: 0; padding: 0; }
  [class*="print-doc-"] + [class*="print-doc-"] { page-break-before: always; break-before: page; }
</style>
<style>
        /* A4 紙張規格設定 */
        @page print-doc-0 {
            size: A4;
            margin: 5mm 0.25in;
        }

        .print-doc-0{
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            color: #000;
            line-height: 1.2;
        }

        .print-doc-0 .container{ width: 100%; box-sizing: border-box; }

        /* 標題區域極致上推 */
        .print-doc-0 .header-section{
            position: relative;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .print-doc-0 .header-section h1{ margin: 0; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .print-doc-0 .header-section h2{ 
            margin: 5px 0 0 0; 
            font-size: 20px; 
            font-weight: bold; 
            display: inline-block;
            border-bottom: 1.5px solid black;
            padding-bottom: 2px;
        }

        .print-doc-0 .page-counter{
            position: absolute;
            right: 0;
            top: 25px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 資訊欄位隱形表格 */
        .print-doc-0 .info-table{
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 5px;
            table-layout: fixed;
        }
        .print-doc-0 .info-table td{
            border: none;
            padding: 2px 0;
            vertical-align: bottom;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* DB Mapping 組件 */
        .print-doc-0 .db-line-input{
            width: 90%;
            border: none;
            border-bottom: 1px solid black;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            padding: 0 5px;
        }

        /* 主表格設定 - 嚴格復刻一比一框線 */
        .print-doc-0 table.main-table{ 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
            border: 1.5px solid black; 
        }
        .print-doc-0 table.main-table th,.print-doc-0 table.main-table td{ 
            border: 1px solid black; 
            text-align: center; 
            vertical-align: middle; 
            padding: 0; 
        }
        
        .print-doc-0 table.main-table th{ 
            font-size: 14px; 
            font-weight: bold; 
            height: 28px; 
            background-color: #fff; 
        }
        
        /* 欄寬精確分配 */
        .print-doc-0 .col-date{ width: 14%; } /* 日期/更期 */
        .print-doc-0 .col-content{ width: 74%; } /* 護理/治療 */
        .print-doc-0 .col-sign{ width: 12%; } /* 簽名 */

        /* 數據行高度精算 (34行不超頁) */
        .print-doc-0 .data-row{ height: 25.5px; }
        
        .print-doc-0 .db-text-cell{
            width: 100%; height: 100%; border: none; background: transparent;
            font-family: inherit; font-size: 14px; text-align: left;
            padding: 0 8px; box-sizing: border-box; outline: none;
            display: block;
        }
        .print-doc-0 .center-input{ text-align: center; padding: 0; }

        /* 頁尾頁碼與代碼 */
        .print-doc-0 .footer{
            margin-top: 5px;
            display: flex;
            justify-content: flex-end;
            position: relative;
            height: 30px;
        }
        .print-doc-0 .page-num{
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            bottom: 0;
        }
        .print-doc-0 .doc-code{ font-size: 10px; align-self: flex-end; font-weight: bold; }
    </style>
<style>.print-doc-0 { page: print-doc-0; }</style>
</head>
<body>
<div class="print-doc-0"><div class="container">
    <!-- 頂部標題部 -->
    <div class="header-section">
        <h1>善頤(福群)護老院</h1>
        <h2>護理及治療記錄</h2>
        <div class="page-counter">第&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;頁</div>
    </div>

    <!-- 院友基本資料 -->
    <table class="info-table">
        <colgroup>
            <col style="width: 85px;">  <!-- 姓名標籤 -->
            <col style="width: auto;">  <!-- 姓名輸入 -->
            <col style="width: 60px;">  <!-- 床號標籤 -->
            <col style="width: 150px;"> <!-- 床號輸入 -->
            <col style="width: 95px;">  <!-- 性別標籤 -->
            <col style="width: 150px;"> <!-- 性別輸入 -->
        </colgroup>
        <tr>
            <td>院友姓名：</td>
            <td><input type="text" class="db-line-input"></td>
            <td>床號：</td>
            <td><input type="text" class="db-line-input"></td>
            <td>性別/年齡：</td>
            <td><input type="text" class="db-line-input"></td>
        </tr>
    </table>

    <!-- 主表格 -->
    <table class="main-table">
        <colgroup>
            <col class="col-date">
            <col class="col-content">
            <col class="col-sign">
        </colgroup>
        <thead>
            <tr>
                <th>日期/更期</th>
                <th>護理/治療</th>
                <th>簽名</th>
            </tr>
        </thead>
        <tbody>
            <!-- 生成 34 行數據 -->
            <script>(function () {
  var __realDoc = window.document;
  var __scope = __realDoc.querySelector('.print-doc-0') || __realDoc.body;
  var document = new Proxy(__realDoc, {
    get: function (target, prop) {
      if (prop === 'querySelector' || prop === 'querySelectorAll') {
        return function (sel) { return __scope[prop](sel); };
      }
      if (prop === 'getElementById') {
        return function (id) { return __scope.querySelector('#' + id); };
      }
      if (prop === 'body') return __scope;
      var v = target[prop];
      return typeof v === 'function' ? v.bind(target) : v;
    }
  });

                for (let i = 0; i < 34; i++) {
                    document.write('<tr class="data-row">');
                    document.write('<td><input type="text" class="db-text-cell center-input"></td>');
                    document.write('<td><input type="text" class="db-text-cell"></td>');
                    document.write('<td><input type="text" class="db-text-cell center-input"></td>');
                    document.write('</tr>');
                }
            
})();</script>
        </tbody>
    </table>

    <!-- 頁尾 -->
    <div class="footer">
        <div class="page-num">6</div>
        <div class="doc-code">B14 FK (11.2020)</div>
    </div>
</div></div>
</body>
</html>
