<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  /* 範本的 body{margin:0} 已被隔離到容器 class，外層 body 必須自行歸零，
     否則瀏覽器預設 8px margin 會改變每份文件的版面位置並可能導致超頁 */
  html, body { margin: 0; padding: 0; }
  [class*="print-doc-"] + [class*="print-doc-"] { page-break-before: always; break-before: page; }
</style>
<style>
        @page print-doc-0 {
            size: A4;
            margin: 5mm 0.25in 15mm 0.25in;
        }

        .print-doc-0{
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            color: #000;
            font-size: 11px;
            line-height: 1.1;
        }

        .print-doc-0 .print-wrapper{
            width: 100%;
            border-collapse: collapse;
        }

        .print-doc-0 .page-header{ display: table-header-group; }
        .print-doc-0 .page-footer{ display: table-footer-group; }

        .print-doc-0 .container{ width: 100%; box-sizing: border-box; }

        .print-doc-0 .title-section{ text-align: center; margin-bottom: 5px; }
        .print-doc-0 .title-section h1{ margin: 0; font-size: 30px; font-weight: bold; }
        .print-doc-0 .title-section h2{ margin: 0; font-size: 24px; font-weight: bold; }

        .print-doc-0 .user-info{ display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: bold; font-size: 14px; }
        
        /* 解決跨頁底線消失問題，改用 span */
        .print-doc-0 .db-line-input{ 
            display: inline-block;
            border: none; 
            border-bottom: 1px solid black; 
            background: transparent; 
            font-family: inherit; 
            padding: 0 2px; 
            vertical-align: bottom;
            min-height: 14px;
        }

        .print-doc-0 .instructions{ font-size: 12px; margin-bottom: 4px; border-top: 0.5px solid #ccc; padding-top: 2px; text-align: left; }
        .print-doc-0 .instructions ul{ margin: 0; padding-left: 15px; list-style-type: disc; }

        .print-doc-0 .main-table{ width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.2px solid black; }
        .print-doc-0 .main-table th,.print-doc-0 .main-table td{ border: 1px solid black; vertical-align: top; padding: 1px 2px; }
        
        .print-doc-0 .main-table th{ height: 20px; text-align: center; vertical-align: middle; font-weight: bold; font-size: 14px; }

        .print-doc-0 .col-date{ width: 62px; }
        .print-doc-0 .col-reason{ width: 125px; }
        .print-doc-0 .col-type{ width: 135px; }
        .print-doc-0 .col-doctor{ width: 80px; }
        .print-doc-0 .col-obs{ width: auto; }

        /* 關鍵修正：縮減內部項目高度，讓外層 record-row 的 height 屬性能夠被生效 */
        .print-doc-0 .opt-item{ 
            display: flex; 
            align-items: center; 
            margin: 0; 
            white-space: nowrap; 
            font-size: 13px; 
            height: 13px; /* 縮減高度 */
            line-height: 1;
        }
        .print-doc-0 .db-checkbox{ width: 10px; height: 10px; margin-right: 2px; cursor: pointer; }
        
        .print-doc-0 .db-text-cell{ width: 100%; height: 100%; border: none; background: transparent; font-family: inherit; font-size: 10.5px; outline: none; }

        /* 紀錄列高度：現在設定 25mm 就能生效，因為內部總高已降至約 13x7=91px (24mm) 以下 */
        .print-doc-0 .record-row{ height: 30mm; }
        .print-doc-0 .record-row td{ page-break-inside: avoid; break-inside: avoid; }

        .print-doc-0 .footer-content{ margin-top: 5px; display: flex; justify-content: flex-end; position: relative; height: 30px; font-weight: bold; width: 100%; }
        .print-doc-0 .page-num{ position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; bottom: 5px; }
        .print-doc-0 .doc-code{ font-size: 9px; align-self: flex-end; padding-bottom: 5px; }
    </style>
<style>.print-doc-0 { page: print-doc-0; }</style>
</head>
<body>
<div class="print-doc-0"><table class="print-wrapper">
    <thead class="page-header">
        <tr>
            <td>
                <div class="container">
                    <div class="title-section">
                        <h1>善頤(福群)護老院</h1>
                        <h2>使用約束物品紀錄</h2>
                    </div>
                    <br>
                    <div class="user-info">
                        <div>姓名：<span class="db-line-input" style="width: 130px;"></span></div>
                        <div>床號：<span class="db-line-input" style="width: 80px;"></span></div>
                        <div>身份證號碼：<span class="db-line-input" style="width: 150px;"></span></div>
                    </div>
                    <div class="instructions">
                        <ul>
                            <li>原因：自身安全、維持治療、防止跌倒、免傷害他人等等</li>
                            <li>種類：約束衣、手/足約束帶、約束手套、防滑褲帶、枱板、床欄等等</li>
                            <li>觀察事項：血液循環、呼吸狀況、精神狀況、皮膚狀況、姿勢舒適等等</li>
                        </ul>
                    </div>
                    <table class="main-table" style="border-bottom: none;">
                        <thead>
                            <tr>
                                <th class="col-date">開始日期</th>
                                <th class="col-date">結束日期</th>
                                <th class="col-reason">原因</th>
                                <th class="col-type">種類</th>
                                <th class="col-doctor">處方醫生</th>
                                <th class="col-obs">需要觀察事項</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </td>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>
                <table class="main-table" style="border-top: none;">
                    <script>(function () {
  var __realDoc = window.document;
  var __scope = __realDoc.querySelector('.print-doc-0') || __realDoc.body;
  var document = new Proxy(__realDoc, {
    get: function (target, prop) {
      if (prop === 'querySelector' || prop === 'querySelectorAll') {
        return function (sel) { return __scope[prop](sel); };
      }
      if (prop === 'getElementById') {
        return function (id) { return __scope.querySelector('#' + id); };
      }
      if (prop === 'body') return __scope;
      var v = target[prop];
      return typeof v === 'function' ? v.bind(target) : v;
    }
  });

                        // 這裡支援 DB 筆數增減，保底 7 筆
                        const dbData = window.importedData || []; 
                        const minRows = 7;
                        const totalRowsToRender = Math.max(dbData.length, minRows);

                        const reasonList = ["自身安全", "維持治療", "防止跌倒", "免傷害他人", "其他:"];
                        const typeList = ["約束衣", "約束腰帶", "手腕帶", "約束手套", "防滑褲帶", "枱板", "其他:"];
                        const obsList = ["血液循環", "呼吸狀況", "精神狀況", "皮膚狀況", "姿勢舒適", "其他:"];

                        for(let i=0; i < totalRowsToRender; i++) {
                            const rowData = dbData[i] || {}; 
                            document.write('<tr class="record-row">');
                            document.write('<td class="col-date"><input type="text" class="db-text-cell" value="' + (rowData.startDate || '') + '"></td>');
                            document.write('<td class="col-date"><input type="text" class="db-text-cell" value="' + (rowData.endDate || '') + '"></td>');
                            
                            document.write('<td class="col-reason">');
                            reasonList.forEach(item => {
                                document.write(`<div class="opt-item"><input type="checkbox" class="db-checkbox">${item}${item.includes(':') ? '<input type="text" class="db-line-input" style="width:55px; min-height:10px;">' : ''}</div>`);
                            });
                            document.write('</td>');

                            document.write('<td class="col-type">');
                            typeList.forEach(item => {
                                document.write(`<div class="opt-item"><input type="checkbox" class="db-checkbox">${item}${item.includes(':') ? '<input type="text" class="db-line-input" style="width:55px; min-height:10px;">' : ''}</div>`);
                            });
                            document.write('</td>');

                            document.write('<td class="col-doctor"><input type="text" class="db-text-cell" value="' + (rowData.doctor || '') + '"></td>');

                            document.write('<td class="col-obs">');
                            obsList.forEach(item => {
                                document.write(`<div class="opt-item"><input type="checkbox" class="db-checkbox">${item}${item.includes(':') ? '<input type="text" class="db-line-input" style="width:55px; min-height:10px;">' : ''}</div>`);
                            });
                            document.write('</td>');
                            document.write('</tr>');
                        }
                    
})();</script>
                </table>
            </td>
        </tr>
    </tbody>

    <tfoot class="page-footer">
        <tr>
            <td>
                <div class="footer-content">
                    <div class="page-num">11</div>
                    <div class="doc-code">B10D FK (2.2025)</div>
                </div>
            </td>
        </tr>
    </tfoot>
</table></div>
</body>
</html>
