<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  /* 範本的 body{margin:0} 已被隔離到容器 class，外層 body 必須自行歸零，
     否則瀏覽器預設 8px margin 會改變每份文件的版面位置並可能導致超頁 */
  html, body { margin: 0; padding: 0; }
  [class*="print-doc-"] + [class*="print-doc-"] { page-break-before: always; break-before: page; }
</style>
<style>
        /* 1. A4 規格與頁面平衡 */
        @page print-doc-0 {
            size: A4;
            margin: 5mm 0.25in;
        }

        .print-doc-0{
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            width: 100%;
            color: #000;
            font-size: 13px;
        }

        .print-doc-0 .container{ width: 100%; box-sizing: border-box; }

        .print-doc-0 .title-box{ text-align: center; margin-top: -5px; margin-bottom: 5px; }
        .print-doc-0 .title-box h1{ margin: 0; font-size: 22px; font-weight: bold; }
        .print-doc-0 .title-box h2{ margin: 0; font-size: 18px; font-weight: bold; }

        .print-doc-0 .info-row{ display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: bold; }
        .print-doc-0 .db-line-input{ border: none; border-bottom: 1px solid black; background: transparent; font-family: inherit; font-size: 13px; }

        .print-doc-0 .habit-row{ font-weight: bold; line-height: 1.2; margin-bottom: 4px; }
        .print-doc-0 .db-checkbox{ width: 13px; height: 13px; vertical-align: middle; cursor: pointer; }
        .print-doc-0 .opt-span{ margin-right: 8px; white-space: nowrap; font-size: 12px; }

        /* 3. 表格核心高度控制 */
        .print-doc-0 table{ width: 100%; border-collapse: collapse; table-layout: fixed; }
        .print-doc-0 th,.print-doc-0 td{ border: 1px solid black; text-align: center; vertical-align: middle; padding: 0px 1px; height: 19.5px; font-size: 11.5px; }
        
        .print-doc-0 .col-m{ width: 8.5mm; font-weight: bold; line-height: 1.0; font-size: 11px; }
        .print-doc-0 .col-s{ width: 26mm; font-weight: bold; text-align: left; padding-left: 2px; }
        .print-doc-0 .col-e{ width: auto; }

        /* 表格內組件 */
        .print-doc-0 .db-text-cell{ width: 100%; border: none; background: transparent; font-family: inherit; text-align: center; outline: none; font-size: 11px; }
        .print-doc-0 .side-opt{ display: inline-flex; align-items: center; margin: 0 1px; font-size: 10px; font-weight: normal; }

        /* 4. 頁尾 */
        .print-doc-0 .footer{ margin-top: 5px; display: flex; justify-content: flex-end; position: relative; height: 20px; font-weight: bold; }
        .print-doc-0 .page-num{ position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; bottom: 0; }
        .print-doc-0 .doc-code{ font-size: 10px; }

        .print-doc-0 tr{ page-break-inside: avoid; }
    </style>
<style>.print-doc-0 { page: print-doc-0; }</style>
</head>

            items.forEach(it => {
                it.rows.forEach((rowName, index) => {
                    let cellContent = '';
                    // 如果不是最後一行（不是種類行），就放 checkbox
                    if (index < it.rows.length - 1) {
                        cellContent = '<td><input type="checkbox" class="db-checkbox"></td>'.repeat(6);
                    } else {
                        // 最後一行（種類行）保留 text-cell
                        cellContent = '<td><input type="text" class="db-text-cell"></td>'.repeat(6);
                    }

                    if (index === 0) {
                        document.write(`<tr><th rowspan="${it.rows.length}" class="col-m">${it.t}</th><td class="col-s">${rowName}</td>${cellContent}</tr>`);
                    } else {
                        document.write(`<tr><td class="col-s">${rowName}</td>${cellContent}</tr>`);
                    }
                });
