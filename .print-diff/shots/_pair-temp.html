<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  /* 範本的 body{margin:0} 已被隔離到容器 class，外層 body 必須自行歸零，
     否則瀏覽器預設 8px margin 會改變每份文件的版面位置並可能導致超頁 */
  html, body { margin: 0; padding: 0; }
  [class*="print-doc-"] + [class*="print-doc-"] { page-break-before: always; break-before: page; }
</style>
<style>
        @page print-doc-0 { size: A4; margin: 5mm 0.2in; }
        .print-doc-0{ font-family: "DFKai-SB", "BiauKai", "標楷體", serif; margin: 0; padding: 0; background-color: #fff; color: #000; line-height: 1.1; }
        .print-doc-0 .container{ width: 100%; box-sizing: border-box; }
        .print-doc-0 .title-section{ text-align: center; margin-bottom: 12px; }
        .print-doc-0 .title-section h1{ margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 2px; }
        .print-doc-0 .title-section h2{ margin: 4px 0 0 0; font-size: 22px; font-weight: bold; display: inline-block; border-bottom: 1.5px solid black; padding-bottom: 2px; }
        .print-doc-0 .info-table{ width: 100%; border-collapse: collapse; margin-bottom: 8px; table-layout: fixed; }
        .print-doc-0 .info-table td{ border: none; padding: 2px 0; vertical-align: bottom; font-size: 16px; font-weight: bold; white-space: nowrap; }
        .print-doc-0 .db-line-input{ width: 90%; border: none; border-bottom: 1px solid black; background: transparent; font-family: inherit; font-size: 16px; outline: none; padding: 0 0 1px 5px; box-sizing: border-box; }
        .print-doc-0 table.main-table{ width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.5px solid black; }
        .print-doc-0 table.main-table th,.print-doc-0 table.main-table td{ border: 1px solid black; text-align: center; vertical-align: middle; padding: 0; }
        .print-doc-0 table.main-table th{ font-size: 11px; font-weight: bold; background-color: #fff; height: 38px; line-height: 1.1; }
        .print-doc-0 .data-row{ height: 30px; }
        .print-doc-0 .db-text-cell{ width: 100%; height: 100%; border: none; background: transparent; font-family: inherit; font-size: 11px; text-align: center; outline: none; display: block; box-sizing: border-box; }
        .print-doc-0 .set-divider{ border-right: 3px solid black !important; }
        .print-doc-0 .footer{ margin-top: 8px; display: flex; justify-content: flex-end; position: relative; height: 30px; }
        .print-doc-0 .page-num{ position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; bottom: 0; }
        .print-doc-0 .doc-code{ font-size: 11px; font-weight: bold; align-self: flex-end; }
    </style>
<style>.print-doc-0 { page: print-doc-0; }</style>
<style>
