<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>餐膳指引卡片</title>
<style>
@page {
  size: A4 portrait;
  margin: 0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 0;
  font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
  background: #fff;
}
/* A4 直向 210×297：左右頁邊 5mm、卡間 6mm；垂直 69mm 白位平分（頁邊+行距各 17.25mm） */
.mg-page {
  width: 210mm;
  height: 297mm;
  padding: 17.25mm 5mm;
  display: grid;
  grid-template-columns: 97mm 97mm;
  grid-template-rows: 76mm 76mm 76mm;
  column-gap: 6mm;
  row-gap: 17.25mm;
  page-break-after: always;
}
.mg-page:last-child {
  page-break-after: auto;
}
.mg-card {
  width: 97mm;
  height: 76mm;
  border: 1pt solid #000;
  border-radius: 3mm;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  font-weight: bold;
}
.mg-header {
  height: 15mm;
  padding: 0 3mm;
  display: flex;
  align-items: center;
  gap: 3mm;
  border-bottom: 1pt solid #000;
}
.mg-bed {
  font-size: 24pt;
  font-weight: bold;
  white-space: nowrap;
}
.mg-name {
  font-size: 24pt;
  font-weight: bold;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mg-body {
  flex: 1;
  display: flex;
  border-bottom: 1pt solid #000;
  min-height: 0;
}
.mg-photo-area {
  width: 50%;
  min-width: 50%;
  border-right: 1pt solid #000;
  background: #f9fafb;
  padding: 1mm;
}
.mg-photo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.mg-details {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1mm 2mm;
  overflow: hidden;
}
.mg-info {
  display: flex;
  flex-direction: column;
  gap: 1mm;
  max-height: 100%;
  overflow: hidden;
}
.mg-line {
  font-size: 25pt;
  line-height: 1.25;
  word-break: break-word;
}
.mg-line-red {
  color: #dc2626;
}
.mg-footer {
  height: 12mm;
  padding: 0 3mm;
  font-size: 15pt;
  line-height: 1.3;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
}
.mg-footer-label {
  font-weight: bold;
}
.mg-footer-red {
  color: #dc2626;
}
.mg-footer-wrap {
  white-space: normal;
  font-size: 11pt;
  line-height: 1.25;
}
@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="mg-page">
        <div class="mg-card">
      <div class="mg-header" style="background-color: #fde047; color: #000;">
        <div class="mg-bed">A101-2</div>
        <div class="mg-name">陳大文</div>
      </div>
      <div class="mg-body">
        <div class="mg-photo-area">
          
        </div>
        <div class="mg-details">
          <div class="mg-info"><div class="mg-line">軟飯</div><div class="mg-line">碎餸</div></div>
        </div>
      </div>
      <div class="mg-footer mg-footer-wrap"><span class="mg-footer-label">備註：</span><span class="mg-footer-red">凝固粉 每餐2匙（清透配方）；每日限水 1000ml</span></div>
    </div>
      </div>
</body>
</html>
