  <rect x="560" y="200" width="80" height="140" rx="12" fill="#93C5FD"/>
  <!-- Elderly person -->
  <circle cx="600" cy="260" r="35" fill="#FDE68A"/>
  <rect x="550" y="290" width="100" height="110" rx="16" fill="#DBEAFE"/>
  <rect x="550" y="380" width="45" height="80" rx="12" fill="#374151"/>
  <rect x="605" y="380" width="45" height="80" rx="12" fill="#374151"/>
