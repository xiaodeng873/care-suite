  <line x1="340" y1="340" x2="380" y2="340" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="340" y1="360" x2="370" y2="360" stroke="#9CA3AF" stroke-width="2"/>
  <!-- Plant -->
  <ellipse cx="120" cy="440" rx="60" ry="20" fill="#86EFAC"/>
  <rect x="112" y="380" width="16" height="60" rx="4" fill="#A16207"/>
  <circle cx="120" cy="370" r="35" fill="#4ADE80"/>
  <circle cx="95" cy="395" r="25" fill="#22C55E"/>
  <circle cx="145" cy="395" r="25" fill="#22C55E"/>
