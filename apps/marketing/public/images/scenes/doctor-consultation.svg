  <circle cx="280" cy="220" r="30" fill="#FDE68A"/>
  <rect x="250" y="250" width="60" height="90" rx="12" fill="#FFFFFF"/>
  <rect x="250" y="250" width="60" height="25" rx="4" fill="#2563EB"/>
  <rect x="265" y="190" width="30" height="15" rx="4" fill="#2563EB"/>
