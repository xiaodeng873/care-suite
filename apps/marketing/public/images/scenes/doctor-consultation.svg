  <path d="M280 280 Q280 330 310 330" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="310" cy="330" r="8" fill="#4B5563"/>
  <!-- Clipboard -->
  <rect x="330" y="300" width="60" height="80" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
