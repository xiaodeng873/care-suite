<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Window -->
  <rect x="100" y="80" width="240" height="180" rx="12" fill="#BAE6FD"/>
  <rect x="120" y="100" width="200" height="140" rx="8" fill="#E0F2FE"/>
  <rect x="215" y="100" width="10" height="140" fill="#BAE6FD"/>
  <rect x="120" y="165" width="200" height="10" fill="#BAE6FD"/>
  <!-- Plant -->
  <ellipse cx="650" cy="420" rx="60" ry="20" fill="#86EFAC"/>
  <rect x="640" y="340" width="20" height="80" rx="4" fill="#A16207"/>
  <circle cx="650" cy="320" r="40" fill="#4ADE80"/>
  <circle cx="620" cy="350" r="30" fill="#22C55E"/>
  <circle cx="680" cy="350" r="30" fill="#22C55E"/>
  <!-- Bed -->
  <rect x="120" y="300" width="300" height="120" rx="12" fill="#F3F4F6"/>
  <rect x="120" y="360" width="300" height="60" rx="8" fill="#E5E7EB"/>
  <rect x="130" y="310" width="80" height="50" rx="8" fill="#FFFFFF"/>
  <!-- Elderly person -->
  <circle cx="260" cy="290" r="35" fill="#FDE68A"/>
  <path d="M240 320 Q260 360 280 320" stroke="#FDE68A" stroke-width="24" stroke-linecap="round" fill="none"/>
  <rect x="220" y="340" width="80" height="80" rx="16" fill="#BFDBFE"/>
  <!-- Nurse -->
  <circle cx="420" cy="240" r="30" fill="#FDE68A"/>
  <path d="M400 270 Q420 310 440 270" stroke="#FDE68A" stroke-width="20" stroke-linecap="round" fill="none"/>
  <rect x="390" y="290" width="60" height="90" rx="12" fill="#FFFFFF"/>
  <rect x="390" y="290" width="60" height="25" rx="4" fill="#2563EB"/>
  <rect x="405" y="225" width="30" height="15" rx="4" fill="#2563EB"/>
  <!-- Clipboard -->
  <rect x="450" y="310" width="50" height="70" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <line x1="460" y1="330" x2="490" y2="330" stroke="#D97706" stroke-width="2"/>
  <line x1="460" y1="345" x2="490" y2="345" stroke="#D97706" stroke-width="2"/>
  <line x1="460" y1="360" x2="480" y2="360" stroke="#D97706" stroke-width="2"/>
  <!-- Soft shapes -->
  <circle cx="700" cy="120" r="50" fill="#FEF9C3" opacity="0.6"/>
  <circle cx="80" cy="400" r="70" fill="#DBEAFE" opacity="0.6"/>
</svg>