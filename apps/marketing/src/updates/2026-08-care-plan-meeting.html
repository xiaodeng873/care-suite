      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 16px;">照顧計劃與個案會議增強</h1>
      <p class="section-subtitle" style="font-size: 1.125rem;">ICP 檢討通常需要開個案會議，誰出席、討論了什麼、結論如何，紙本記錄容易散亂。</p>

      <h2>改善內容</h2>
      <ul>
        <li><strong>個案會議名單：</strong>記錄與會者、討論日期與會議結論。</li>
        <li><strong>跟進事項：</strong>為每項 ICP 計劃設定責任人與跟進狀態。</li>
        <li><strong>狀態管理：</strong>計劃進度與復檢日期更清晰，避免「寫完就算」。</li>
      </ul>

      <h2>誰會受惠</h2>
      <p>負責撰寫與檢討 ICP 的護士、社工、專職治療師，以及需要統籌全院照顧計劃的護理主管。</p>
