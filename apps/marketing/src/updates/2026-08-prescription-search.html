      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 16px;">處方搜尋與可見性設定</h1>
      <p class="section-subtitle" style="font-size: 1.125rem;">院友一多，要快速找出某位院友的某張處方，或者確認「這隻藥最後幾時食過」，逐頁翻查極慢。</p>

      <h2>新功能內容</h2>
      <ul>
        <li><strong>處方搜尋頁：</strong>按院友、藥名、狀態等條件快速定位處方，減少逐頁翻查。</li>
        <li><strong>最後服用日期：</strong>每張處方可記錄最後服用日期，方便核對與追蹤。</li>
        <li><strong>可見性設定：</strong>可控制處方在常用列表中是否顯示，減少畫面雜訊，同時保留歷史。</li>
      </ul>

      <h2>誰會受惠</h2>
      <p>負責派藥與核對的護士、保健員，以及需要快速查閱處方狀態的護理主管。</p>
