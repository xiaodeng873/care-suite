<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>護理及治療記錄 - 善頤(福群)</title>
    <style>
        /* A4 紙張規格設定 */
        @page {
            size: A4;
            margin: 5mm 0.25in;
        }

        body {
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            color: #000;
            line-height: 1.2;
        }

        .container { width: 100%; box-sizing: border-box; }

        /* 標題區域極致上推 */
        .header-section {
            position: relative;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .header-section h1 { margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 2px; }
        .header-section h2 { 
            margin: 4px 0 0 0; 
            font-size: 22px; 
            font-weight: bold; 
            display: inline-block;
            border-bottom: 1.5px solid black;
            padding-bottom: 2px;
        }

        .page-counter {
            position: absolute;
            right: 0;
            top: 25px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 資訊欄位隱形表格 */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 5px;
            table-layout: fixed;
        }
        .info-table td {
            border: none;
            padding: 2px 0;
            vertical-align: bottom;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* DB Mapping 組件 */
        .db-line-input {
            width: 90%;
            border: none;
            border-bottom: 1px solid black;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            padding: 0 5px;
        }

        /* 主表格設定 - 嚴格復刻一比一框線 */
        table.main-table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
            border: 1.5px solid black; 
        }
        table.main-table th, table.main-table td { 
            border: 1px solid black; 
            text-align: center; 
            vertical-align: middle; 
            padding: 0; 
        }
        
        table.main-table th { 
            font-size: 14px; 
            font-weight: bold; 
            height: 28px; 
            background-color: #fff; 
        }
        
        /* 欄寬精確分配 */
        .col-date   { width: 14%; } /* 日期/更期 */
        .col-content { width: 74%; } /* 護理/治療 */
        .col-sign   { width: 12%; } /* 簽名 */

        /* 數據行高度精算 (34行不超頁) */
        .data-row { height: 25.5px; }
        
        .db-text-cell {
            width: 100%; height: 100%; border: none; background: transparent;
            font-family: inherit; font-size: 14px; text-align: left;
            padding: 0 8px; box-sizing: border-box; outline: none;
            display: block;
        }
        .center-input { text-align: center; padding: 0; }

        /* 頁尾頁碼與代碼 */
        .footer {
            display: flex;
            justify-content: flex-end;
            position: relative;
            height: 30px;
            font-weight: bold;
        }
        .page-num {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            bottom: 0;
        }
        .doc-code { font-size: 11px; align-self: flex-end; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部標題部 -->
    <div class="header-section">
        <h1>善頤(福群)護老院</h1>
        <h2>護理及治療記錄</h2>
        <div class="page-counter">第&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;頁</div>
    </div>

    <!-- 院友基本資料 -->
    <table class="info-table">
        <colgroup>
            <col style="width: 85px;">  <!-- 姓名標籤 -->
            <col style="width: auto;">  <!-- 姓名輸入 -->
            <col style="width: 60px;">  <!-- 床號標籤 -->
            <col style="width: 150px;"> <!-- 床號輸入 -->
            <col style="width: 95px;">  <!-- 性別標籤 -->
            <col style="width: 150px;"> <!-- 性別輸入 -->
        </colgroup>
        <tr>
            <td>院友姓名：</td>
            <td><input type="text" class="db-line-input"></td>
            <td>床號：</td>
            <td><input type="text" class="db-line-input"></td>
            <td>性別/年齡：</td>
            <td><input type="text" class="db-line-input"></td>
        </tr>
    </table>

    <!-- 主表格 -->
    <table class="main-table">
        <colgroup>
            <col class="col-date">
            <col class="col-content">
            <col class="col-sign">
        </colgroup>
        <thead>
            <tr>
                <th>日期/更期</th>
                <th>護理/治療</th>
                <th>簽名</th>
            </tr>
        </thead>
        <tbody>
            <!-- 生成 34 行數據 -->
            <script>
                for (let i = 0; i < 34; i++) {
                    document.write('<tr class="data-row">');
                    document.write('<td><input type="text" class="db-text-cell center-input"></td>');
                    document.write('<td><input type="text" class="db-text-cell"></td>');
                    document.write('<td><input type="text" class="db-text-cell center-input"></td>');
                    document.write('</tr>');
                }
            </script>
        </tbody>
    </table>

    <!-- 頁尾 -->
    <div class="footer">
        <div class="page-num">6</div>
        <div class="doc-code">B14 FK (11.2020)</div>
    </div>
</div>

</body>
</html>
