<!DOCTYPE html>

    <style>
        /* A4 紙張規格：左右 0.25 吋出血位，頂部上移 */
        @page {
            size: A4;
            margin: 5mm 0.25in 5mm 0.25in;
        }

        body {
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            width: 100%;
            color: #000;
        }

        .container { width: 100%; box-sizing: border-box; }

        /* 章節標題 */
        .section-title { font-size: 15px; font-weight: bold; margin: 10px 0 2px 20px; }

        /* 表格通用設定 */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 0; }
        th, td { border: 1px solid black; text-align: center; vertical-align: middle; padding: 2px; height: 23px; font-size: 12px; }
        
        .bold { font-weight: bold; }
        
        /* 標籤欄寬度 (對齊前幾項的總和 10mm + 25mm = 35mm) */
        .label-col { width: 35mm; text-align: center; font-weight: bold; }
        .col-eval { width: auto; }

        /* 簽署欄文字靠左頂格 */
        .sign-label { text-align: left; vertical-align: top; padding: 4px; line-height: 1.3; }

        /* 兩個表格之間的間隙 */
        .table-gap { height: 8px; }

        /* DB組件 */
        .db-text-cell { width: 100%; height: 100%; border: none; background: transparent; font-family: inherit; font-size: 12px; text-align: center; outline: none; }

        /* 頁尾頁碼與代碼 */
        .footer { display: flex; justify-content: flex-end; position: relative; height: 25px; font-weight: bold; margin-top: 10px; }
        .page-num { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; bottom: 0; }
        .doc-code { font-size: 10px; align-self: flex-end; }
    </style>
</head>
