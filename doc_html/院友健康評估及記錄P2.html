    <style>
        @page {

        * { box-sizing: border-box; }

        body {
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            margin: 0; padding: 0;
            background-color: #fff;
            width: 100%;
            color: #000;
        }

        .container { width: 100%; box-sizing: border-box; display: flex; flex-direction: column; min-height: 271mm; } /* 可印 272mm (297-15-10)，275mm 會把頁尾擠到第 2 頁 */
        .page-content { flex: 1 1 auto; }

        /* 標題與小項 */
        .section-title { font-size: 18px; font-weight: bold; margin: 8px 0 3px 20px; }

        /* 表格通用設定 */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 10px; }
        th, td { border: 1px solid black; text-align: center; vertical-align: middle; padding: 0px; height: 24px; font-size: 14px; }
        
        .bold { font-weight: bold; }
        .label-m { width: 10mm; font-weight: bold; font-size: 16px; line-height: 1.1; }
        .label-s { width: 25mm; font-weight: bold; text-align: left; padding-left: 3px; font-size: 13px; }
        .col-eval { width: auto; }

        /* DB組件 - 填滿整個格子且透明 */
        .db-text-cell { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: transparent; 
            font-family: inherit; 
            font-size: 12px; 
            text-align: center; 
            outline: none;
            display: block;
            box-sizing: border-box;
        }

        /* 頁尾：緊隨內容，用 flex 推到底 */
        .footer { margin-top: auto; padding-top: 5px; display: flex; justify-content: flex-end; position: relative; min-height: 30px; font-weight: bold; }
        .page-num { position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; bottom: 0; }
        .doc-code { font-size: 11px; font-weight: bold; align-self: flex-end; }
    </style>
</head>
